<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <!-- Cyan to Violet gradient from bottom-left to top-right -->
    <linearGradient id="pill-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="30%" stop-color="#0091FF" />
      <stop offset="70%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg-grad)" />
  <rect x="3" y="3" width="506" height="506" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4" />

  <!-- Ambient background glow behind the logo -->
  <circle cx="256" cy="256" r="140" fill="#6366F1" opacity="0.25" filter="url(#glow)" />
  <circle cx="300" cy="200" r="90" fill="#D946EF" opacity="0.2" filter="url(#glow)" />

  <!-- 3 Diagonal Pills matching official EduNexusAI logo (slanted upwards from bottom-left to top-right) -->
  <g transform="translate(256, 256) rotate(45) translate(-256, -256)">
    <!-- Bar 1 (Left) -->
    <rect x="170" y="185" width="46" height="150" rx="23" fill="url(#pill-grad)" filter="url(#glow)" />
    <!-- Bar 2 (Center) -->
    <rect x="233" y="130" width="46" height="255" rx="23" fill="url(#pill-grad)" filter="url(#glow)" />
    <!-- Bar 3 (Right) -->
    <rect x="296" y="185" width="46" height="150" rx="23" fill="url(#pill-grad)" filter="url(#glow)" />
  </g>
</svg>